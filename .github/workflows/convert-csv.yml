name: Convert catalog CSV to JSON

on:
  push:
    branches: [main, master]
    paths:
      - 'assets/data/*.csv'
  workflow_dispatch:

permissions:
  contents: write

# Cancel superseded runs instead of letting them pile up.
concurrency:
  group: convert-csv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    # Hard stop so a bad input can never leave the job hanging.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert CSV to JSON
        run: python scripts/csv_to_json.py

      # Only runs when the conversion step succeeded. If the CSV was invalid,
      # nothing was written and no commit happens, so the site keeps last-good data.
      - name: Commit generated JSON
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/*.json assets/data/*-data.js
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "chore: regenerate catalog JSON from CSV [skip ci]"
            git push
          fi
